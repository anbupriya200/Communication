    <filter id="flameGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#f97316" flood-opacity="0.5"/>
    </filter>
  </defs>
  <g filter="url(#flameGlow)">
    <!-- Outer Flame -->
    <path d="M 50 8 C 50 8 78 36 78 62 C 78 77 65 92 50 92 C 35 92 22 77 22 62 C 22 42 38 28 42 22 C 45 32 52 35 50 8 Z" fill="url(#flameOuter)"/>
    <!-- Inner Flame -->
    <path d="M 50 36 C 50 36 64 54 64 68 C 64 77 58 84 50 84 C 42 84 36 77 36 68 C 36 56 46 48 48 44 C 50 50 54 50 50 36 Z" fill="url(#flameInner)"/>
  </g>
</svg>
