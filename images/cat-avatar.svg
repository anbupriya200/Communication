<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <!-- Cat Avatar - "Cleo" -->
  <defs>
    <linearGradient id="catBodyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="catChestGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ffedd5"/>
    </linearGradient>
    <filter id="catGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g filter="url(#catGlow)">
    <!-- Tail -->
    <path d="M 115 110 Q 145 100 140 70 Q 135 55 125 65 Q 130 85 110 98 Z" fill="#ea580c"/>

    <!-- Left Ear -->
    <polygon points="32,25 60,50 25,60" fill="#ea580c"/>
    <polygon points="36,32 54,51 30,58" fill="#fca5a5"/>

    <!-- Right Ear -->
    <polygon points="128,25 100,50 135,60" fill="#ea580c"/>
    <polygon points="124,32 106,51 130,58" fill="#fca5a5"/>

    <!-- Head -->
    <ellipse cx="80" cy="72" rx="46" ry="40" fill="url(#catBodyGradient)"/>

    <!-- Eyes (Big Emerald Cat Eyes) -->
    <ellipse cx="60" cy="68" rx="11" ry="14" fill="#10b981"/>
    <ellipse cx="100" cy="68" rx="11" ry="14" fill="#10b981"/>
    <!-- Pupils -->
    <ellipse cx="60" cy="68" rx="5" ry="10" fill="#064e3b"/>
    <ellipse cx="100" cy="68" rx="5" ry="10" fill="#064e3b"/>
    <!-- Eye Highlights -->
    <circle cx="56" cy="63" r="3" fill="#ffffff"/>
    <circle cx="96" cy="63" r="3" fill="#ffffff"/>

    <!-- Muzzle / Snout -->
    <ellipse cx="80" cy="84" rx="16" ry="11" fill="url(#catChestGradient)"/>
    <polygon points="76,80 84,80 80,85" fill="#f43f5e"/>

    <!-- Whiskers -->
    <line x1="28" y1="78" x2="52" y2="81" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="26" y1="88" x2="52" y2="86" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="132" y1="78" x2="108" y2="81" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="134" y1="88" x2="108" y2="86" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Smile -->
    <path d="M 74 88 Q 80 93 86 88" stroke="#1e293b" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- Body -->
    <path d="M 45 100 C 40 135 55 145 80 145 C 105 145 120 135 115 100 Z" fill="url(#catBodyGradient)"/>
    <!-- Chest Patch -->
    <ellipse cx="80" cy="120" rx="18" ry="20" fill="url(#catChestGradient)"/>

    <!-- Paws -->
    <ellipse cx="60" cy="142" rx="12" ry="8" fill="#ffedd5"/>
    <ellipse cx="100" cy="142" rx="12" ry="8" fill="#ffedd5"/>

    <!-- FluentPath Hero Collar & Star Gem -->
    <path d="M 50 102 Q 80 110 110 102" stroke="#6366f1" stroke-width="6" fill="none"/>
    <polygon points="80,105 83,112 90,112 84,116 86,123 80,118 74,123 76,116 70,112 77,112" fill="#f59e0b"/>
  </g>
</svg>
