<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="coinOuter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="coinInner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="coinGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#f59e0b" flood-opacity="0.4"/>
    </filter>
  </defs>
  <g filter="url(#coinGlow)">
    <circle cx="50" cy="50" r="44" fill="url(#coinOuter)"/>
    <circle cx="50" cy="50" r="36" fill="url(#coinInner)" stroke="#d97706" stroke-width="3"/>
    <!-- Star Emblem on Coin -->
    <polygon points="50,26 55,38 68,39 58,48 61,61 50,54 39,61 42,48 32,39 45,38" fill="#d97706"/>
    <!-- Coin Rim Highlight -->
    <ellipse cx="38" cy="24" rx="14" ry="7" fill="#ffffff" opacity="0.4" transform="rotate(-30 38 24)"/>
  </g>
</svg>
