<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 260" width="260" height="260">
  <rect x="0" y="0" width="260" height="260" rx="22" fill="#eef6ff"/>

  <g>
    <!-- Back shadow halo -->
    <ellipse cx="130" cy="210" rx="88" ry="16" fill="#8aa4cc" opacity="0.25"/>

    <!-- Ears -->
    <circle cx="76" cy="62" r="32" fill="#1a191d"/>
    <circle cx="184" cy="62" r="32" fill="#1a191d"/>
    <circle cx="76" cy="62" r="24" fill="#fff"/>
    <circle cx="184" cy="62" r="24" fill="#fff"/>

    <!-- Head main body -->
    <ellipse cx="130" cy="130" rx="82" ry="74" fill="#ffffff" stroke="#1a191d" stroke-width="3"/>

    <!-- Left black patch -->
    <ellipse cx="98" cy="116" rx="28" ry="30" fill="#1a191d"/>
    <!-- Right black patch -->
    <ellipse cx="162" cy="116" rx="28" ry="30" fill="#1a191d"/>

    <!-- Eye white highlights -->
    <ellipse cx="98" cy="116" rx="11" ry="14" fill="#fff"/>
    <ellipse cx="162" cy="116" rx="11" ry="14" fill="#fff"/>

    <!-- Eye black pupils -->
    <ellipse cx="98" cy="116" rx="5" ry="8" fill="#000"/>
    <ellipse cx="162" cy="116" rx="5" ry="8" fill="#000"/>

    <!-- Muzzle / face -->
    <ellipse cx="130" cy="142" rx="34" ry="26" fill="#ffffff" stroke="#1a191d" stroke-width="2"/>

    <!-- Nose -->
    <ellipse cx="130" cy="137" rx="10" ry="8" fill="#1a191d"/>

    <!-- Mouth and cheeks -->
    <path d="M 119 145 Q 130 153 141 145" fill="none" stroke="#1a191d" stroke-width="2" stroke-linecap="round"/>
    <circle cx="106" cy="142" r="4" fill="#c64078" opacity="0.8"/>
    <circle cx="154" cy="142" r="4" fill="#c64078" opacity="0.8"/>

    <!-- Body behind -->
    <ellipse cx="130" cy="188" rx="50" ry="38" fill="#fff" stroke="#1a191d" stroke-width="3"/>
    <ellipse cx="130" cy="188" rx="28" ry="24" fill="#eef6ff" stroke="#1a191d" stroke-width="2"/>

    <!-- Feet -->
    <ellipse cx="109" cy="215" rx="16" ry="9" fill="#1a191d"/>
    <ellipse cx="151" cy="215" rx="16" ry="9" fill="#1a191d"/>

    <!-- Arms -->
    <path d="M 95 165 Q 76 176 82 190 Q 90 182 98 173" fill="#fff" stroke="#1a191d" stroke-width="2"/>
    <path d="M 165 165 Q 184 176 178 190 Q 170 182 162 173" fill="#fff" stroke="#1a191d" stroke-width="2"/>

    <!-- Blue scarf -->
    <path d="M 88 160 Q 130 170 172 160 L 168 178 Q 130 188 92 178 Z" fill="#2563eb" stroke="#1a191d" stroke-width="2"/>

    <!-- Small star badge -->
    <path d="M 130 171 L 134 178 L 144 179 L 136 185 L 138 194 L 130 190 L 122 194 L 124 185 L 116 179 L 126 178 Z" fill="#ffd76a" stroke="#1a191d" stroke-width="2"/>
  </g>
