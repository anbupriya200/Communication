<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="trophyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="baseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="trophyGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#eab308" flood-opacity="0.4"/>
    </filter>
  </defs>
  <g filter="url(#trophyGlow)">
    <!-- Base -->
    <rect x="26" y="80" width="48" height="12" rx="4" fill="url(#baseGrad)"/>
    <rect x="36" y="70" width="28" height="10" rx="2" fill="#475569"/>
    <!-- Handles -->
    <path d="M 24 24 C 8 24 8 50 28 52" stroke="#eab308" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M 76 24 C 92 24 92 50 72 52" stroke="#eab308" stroke-width="6" fill="none" stroke-linecap="round"/>
    <!-- Main Cup -->
    <path d="M 24 16 L 76 16 L 68 54 C 62 66 38 66 32 54 Z" fill="url(#trophyGrad)" stroke="#ca8a04" stroke-width="2"/>
    <!-- Cup Rim Highlight -->
    <ellipse cx="50" cy="16" rx="26" ry="6" fill="#fef08a"/>
    <!-- Star Emblem -->
    <polygon points="50,28 53,35 60,36 55,41 56,48 50,44 44,48 45,41 40,36 47,35" fill="#ffffff" opacity="0.9"/>
  </g>
</svg>
