<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="100%" height="100%">
  <!-- Kangaroo Mascot - "Joey" -->
  <defs>
    <linearGradient id="kangaGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="bellyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fdba74"/>
    </linearGradient>
    <linearGradient id="scarfGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- Tail -->
    <path d="M 125 145 C 165 145 185 175 175 195 C 165 205 140 185 115 170 Z" fill="url(#kangaGradient)"/>

    <!-- Left Leg / Foot -->
    <ellipse cx="65" cy="180" rx="28" ry="12" fill="#c2410c"/>
    <!-- Right Leg / Foot -->
    <ellipse cx="125" cy="180" rx="28" ry="12" fill="#ea580c"/>

    <!-- Main Body -->
    <path d="M 65 110 C 50 145 55 180 95 180 C 135 180 140 145 125 110 Z" fill="url(#kangaGradient)"/>
    
    <!-- Pouch / Belly -->
    <path d="M 75 125 C 75 165 115 165 115 125 C 115 140 75 140 75 125 Z" fill="url(#bellyGradient)"/>
    
    <!-- Baby Kangaroo in Pouch -->
    <circle cx="95" cy="130" r="10" fill="#fb923c"/>
    <circle cx="92" cy="128" r="1.5" fill="#1e293b"/>
    <circle cx="98" cy="128" r="1.5" fill="#1e293b"/>

    <!-- Left Arm -->
    <path d="M 68 115 C 50 120 48 135 58 138 C 68 140 75 125 72 118 Z" fill="#ea580c"/>
    <!-- Right Arm (Cheering wave) -->
    <path d="M 122 115 C 142 105 152 90 145 85 C 138 80 125 100 118 110 Z" fill="#f97316"/>

    <!-- Scarf around neck -->
    <path d="M 70 95 Q 95 108 120 95 Q 115 106 95 108 Q 75 106 70 95 Z" fill="url(#scarfGradient)"/>
    <rect x="102" y="102" width="12" height="24" rx="4" fill="#06b6d4" transform="rotate(15 102 102)"/>

    <!-- Ears -->
    <path d="M 72 55 C 55 20 62 10 74 35 Z" fill="#f97316"/>
    <path d="M 73 53 C 60 25 65 18 73 38 Z" fill="#fca5a5"/>

    <path d="M 118 55 C 135 20 128 10 116 35 Z" fill="#ea580c"/>
    <path d="M 117 53 C 130 25 125 18 117 38 Z" fill="#fca5a5"/>

    <!-- Head -->
    <ellipse cx="95" cy="65" rx="26" ry="24" fill="url(#kangaGradient)"/>
    <!-- Muzzle / Snout -->
    <ellipse cx="95" cy="74" rx="16" ry="12" fill="url(#bellyGradient)"/>
    <ellipse cx="95" cy="69" rx="5" ry="3.5" fill="#1e293b"/>

    <!-- Eyes (Happy / Friendly) -->
    <circle cx="82" cy="58" r="4.5" fill="#1e293b"/>
    <circle cx="108" cy="58" r="4.5" fill="#1e293b"/>
    <circle cx="83.5" cy="56.5" r="1.5" fill="#ffffff"/>
    <circle cx="109.5" cy="56.5" r="1.5" fill="#ffffff"/>

    <!-- Cheeks -->
    <circle cx="76" cy="66" r="4" fill="#f43f5e" opacity="0.4"/>
    <circle cx="114" cy="66" r="4" fill="#f43f5e" opacity="0.4"/>

    <!-- Smile -->
    <path d="M 90 76 Q 95 80 100 76" stroke="#1e293b" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>
</svg>
